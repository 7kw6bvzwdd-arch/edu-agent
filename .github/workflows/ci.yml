name: release-contracts
on: [push, pull_request, workflow_dispatch]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: backend-go/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend-vue/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Start isolated database with ephemeral credentials
        shell: bash
        run: |
          admin_password=$(openssl rand -hex 32)
          runtime_password=$(openssl rand -hex 32)
          echo "::add-mask::$admin_password"
          echo "::add-mask::$runtime_password"
          echo "DATABASE_URL=postgres://edu:$admin_password@127.0.0.1:55432/edu_test?sslmode=disable" >> "$GITHUB_ENV"
          echo "RUNTIME_DATABASE_URL=postgres://edu_app:$runtime_password@127.0.0.1:55432/edu_test?sslmode=disable" >> "$GITHUB_ENV"
          echo "TEST_DATABASE_URL=postgres://edu:$admin_password@127.0.0.1:55432/edu_test?sslmode=disable" >> "$GITHUB_ENV"
          echo "TEST_RUNTIME_DATABASE_URL=postgres://edu_app:$runtime_password@127.0.0.1:55432/edu_test?sslmode=disable" >> "$GITHUB_ENV"
          docker run -d --name edu-ci-postgres -e POSTGRES_USER=edu -e POSTGRES_DB=edu_test -e POSTGRES_PASSWORD="$admin_password" -p 127.0.0.1:55432:5432 pgvector/pgvector:pg16
          for i in $(seq 1 60); do docker exec edu-ci-postgres pg_isready -U edu -d edu_test && break; sleep 1; done
          docker exec edu-ci-postgres pg_isready -U edu -d edu_test
        # GITHUB_ENV becomes visible in the following step.
      - name: Provision isolated runtime role
        working-directory: backend-go
        run: go run ../scripts/provision-database.go
      - run: pip install -r render-service-py/requirements.txt
      # app.py renders Chinese formulas through matplotlib, which emits
      # "Glyph ... missing" and draws tofu unless the face named by FONT
      # actually exists. The runner image ships no CJK font.
      # Reference PDF previews also require Poppler's pdftoppm executable.
      # Must precede the first `import matplotlib` so its font cache sees it.
      - name: Install rendering system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk poppler-utils
          command -v pdftoppm
      - run: python -m pytest -q render-service-py
      - name: Release revision and integrity contracts
        run: |
          python scripts/test-release.py
          python scripts/test-release-integrity.py
      - name: Go portable tests (no database or Office prerequisite)
        working-directory: backend-go
        run: |
          env -u TEST_DATABASE_URL -u TEST_RUNTIME_DATABASE_URL go test -count=1 ./...
          go vet ./...
      - run: python -m uvicorn app:app --app-dir render-service-py --port 8000 > /tmp/edu-render.log 2>&1 &
      # Explicit HTTP boundary suite. Full courseware screenshot acceptance requires
      # installed desktop PowerPoint and is a separate local release gate.
      - name: HTTP authentication, isolation, quota and animation state contracts
        run: |
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/health && break; sleep 1; done
          curl -fsS http://127.0.0.1:8000/health
          cd backend-go
          go test -c -o /tmp/edu-http.test .
          for test_name in TestHTTPMemberQuotaAndIsolation TestRegisterCreatesIsolatedSpaceAndRecovery TestActiveSessionRefreshHTTP TestAccountSettingsHTTP TestCloudHealthHTTP TestMemberPackageAndConcurrentReservations TestHTMLAnimationWorkflowHTTP TestHTMLGeometryWorkflowHTTP TestHTMLGeneralLessonWorkflowHTTP TestHTMLAnimationRecoveryHTTP TestHTMLAnimationCancelledWorkerHTTP TestAnimationExportRecoveryHTTP TestRemediationTeacherWaitPersistsHTTP TestRemediationExpiredLeaseHTTP TestRemediationLoginRateLimitHTTP TestRemediationLiveSimulationHTTP TestRemediationAuthStoragePrivilegesHTTP TestRemediationCredentialFunctionPrivilegesHTTP TestRemediationCredentialNullProofHTTP TestRemediationReviewPolicyHTTP TestRemediationWorkersShutdownAndRenewalHTTP TestRemediationObservabilityAndStreamHTTP TestRemediationAnimationQueueAgingHTTP TestRemediationProcessRecoveryHTTP; do
            database=edu_verify_20261009_$(openssl rand -hex 6)
            docker exec edu-ci-postgres createdb -U edu "$database"
            set +e
            TEST_DATABASE_URL="${DATABASE_URL/edu_test/$database}" TEST_RUNTIME_DATABASE_URL="${RUNTIME_DATABASE_URL/edu_test/$database}" /tmp/edu-http.test -test.count=1 -test.timeout=15m -test.v -test.run="^${test_name}$"
            result=$?
            set -e
            docker exec edu-ci-postgres dropdb -U edu --force "$database"
            if [ "$result" -ne 0 ]; then exit "$result"; fi
          done
        env:
          TEST_RENDER_URL: http://127.0.0.1:8000
      - run: npm ci && npm run format:check && npm run build
        working-directory: frontend-vue
      - name: Browser and classroom fixture contracts (no provider calls)
        run: |
          export TEST_BROWSER_PATH="$(command -v google-chrome)"
          test -n "$TEST_BROWSER_PATH"
          node scripts/test-classroom.cjs
          mkdir -p work/lesson-video work/anim-workflow
          cd backend-go
          go run . --anim-package ../fixtures/animation-v2-linear-k.json ../work/lesson-video/fixture.html tone
          cd ..
          cp work/lesson-video/fixture.html work/anim-workflow/http-fixture.html
          node scripts/browser-needs-dialogue.cjs
          node scripts/browser-animation-workflow.cjs
      - name: Install locked video dependencies
        working-directory: animation-video
        run: npm ci --no-audit --no-fund
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
      - name: Actual MP4 export and browser decoding (explicit test audio)
        timeout-minutes: 20
        run: |
          export TEST_BROWSER_PATH="$(command -v google-chrome)"
          export ANIMATION_CHROME_PATH="$TEST_BROWSER_PATH"
          npm test --prefix animation-video
          node animation-video/playback.test.mjs work/lesson-video/fixture.mp4
      - name: Actual MP4 HTTP download authorization and quota contract
        timeout-minutes: 20
        run: |
          export ANIMATION_CHROME_PATH="$(command -v google-chrome)"
          export ANIMATION_EXPORT_SCRIPT="$GITHUB_WORKSPACE/animation-video/export.mjs"
          export ANIMATION_EXPORT_TEST_SOURCE="$GITHUB_WORKSPACE/work/lesson-video/fixture.html"
          cd backend-go
          go test -count=1 -timeout 18m -v -run '^TestAnimationExportActualMP4HTTP$' ./...
      - name: Retain fixture acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fixture-acceptance-linux
          if-no-files-found: ignore
          path: |
            work/needs-dialogue/browser/checks.json
            work/anim-workflow/browser/report.json
            work/lesson-video/fixture.mp4.json
            work/lesson-video/playback-report.json
  windows:
    needs: checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: backend-go/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Windows Go and release CLI contracts (no Office acceptance claim)
        shell: pwsh
        run: |
          python scripts/test-release.py
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          python scripts/test-release-integrity.py
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          go test -C backend-go -count=1 ./...
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          go vet -C backend-go ./...
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          $errors=$null
          foreach($file in Get-ChildItem scripts/*.ps1){
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName,[ref]$null,[ref]$errors) | Out-Null
            if($errors.Count){throw ($errors | Out-String)}
          }
      - name: Build all release components from the exact commit
        shell: pwsh
        env:
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          python scripts/build-release.py --commit $env:RELEASE_COMMIT --output work/releases/ci-release
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          $identity = Get-Content work/releases/ci-release/manifest.json -Raw | ConvertFrom-Json
          python scripts/verify-release.py --release work/releases/ci-release --expect-tag $identity.tag
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: work/releases/ci-release
