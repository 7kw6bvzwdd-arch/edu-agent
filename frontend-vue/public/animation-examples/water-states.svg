<svg id="stage" viewBox="0 0 1280 720" role="img" aria-label="认识水的三种状态 动画画面" data-side="" xmlns="http://www.w3.org/2000/svg"><title>水可以有哪些状态</title><rect x="0" y="0" width="1280" height="720" fill="#f5f8fc"></rect><text x="48" y="62" font-size="34" font-weight="600" fill="#18324c" data-box="head">水可以有哪些状态</text><g opacity="1" data-lesson="content"><rect x="40" y="108" width="1200" height="488" rx="18" fill="#ffffff" stroke="#d6e2f0" stroke-width="2"></rect><text x="64" y="148" font-size="28" font-weight="600" fill="#18324c">水可以有哪些状态</text><g data-illustration="content" data-kind="water_states"><svg x="60" y="184" width="720" height="360" viewBox="0 0 620 280" preserveAspectRatio="xMidYMid meet" role="img" aria-label="水可以有哪些状态，教学示意，非真实比例"><rect x="12" y="42" width="185" height="180" rx="16" fill="#e7f1fd" stroke="#bfd0e2" stroke-width="2"></rect><text x="104" y="28" text-anchor="middle" font-size="22" fill="#28445e">固态</text><circle cx="54" cy="92" r="8" fill="#377bc8"></circle><circle cx="81" cy="92" r="8" fill="#377bc8"></circle><circle cx="108" cy="92" r="8" fill="#377bc8"></circle><circle cx="135" cy="92" r="8" fill="#377bc8"></circle><circle cx="54" cy="121" r="8" fill="#377bc8"></circle><circle cx="81" cy="121" r="8" fill="#377bc8"></circle><circle cx="108" cy="121" r="8" fill="#377bc8"></circle><circle cx="135" cy="121" r="8" fill="#377bc8"></circle><circle cx="54" cy="150" r="8" fill="#377bc8"></circle><circle cx="81" cy="150" r="8" fill="#377bc8"></circle><circle cx="108" cy="150" r="8" fill="#377bc8"></circle><circle cx="135" cy="150" r="8" fill="#377bc8"></circle><rect x="217" y="42" width="185" height="180" rx="16" fill="#e5f5f1" stroke="#bfd0e2" stroke-width="2"></rect><text x="309" y="28" text-anchor="middle" font-size="22" fill="#28445e">液态</text><circle cx="259" cy="100" r="8" fill="#178c99"></circle><circle cx="291.89029689365526" cy="96.32241844694512" r="8" fill="#178c99"></circle><circle cx="319.3650819877798" cy="88.67082530762286" r="8" fill="#1